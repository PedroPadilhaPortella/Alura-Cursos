<section class="form-wrapper">
  <form class="form" (ngSubmit)="onSubmit()" ngNativeValidate>
    <h2 class="title">Nova Transação</h2>

    <div class="form-group">
      <label>Transação</label>
      <div class="select-wrapper">
        <select name="tipo" [(ngModel)]="transactionType" required="">
          <option value="" selected disabled>Selecione o tipo de transação</option>
          @for(item of transactionTypeEnum | keyvalue; track item.key) {
            <option [value]="item.value">{{ item.value | titlecase  }}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-group">
        <label>Valor</label>
        <div class="input-wrapper">
        <input
          [(ngModel)]="transactionValue"
          type="number"
          min="0.01"
          step="0.01"
          placeholder="00,00"
          name="valor"
          required
        />
      </div>
    </div>

    <button>Confirmar transação</button>
  </form>
</section>
